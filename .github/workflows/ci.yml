name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio_os
          POSTGRES_PASSWORD: studio_os
          POSTGRES_DB: studio_os_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://studio_os:studio_os@localhost:5432/studio_os_ci
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      # No `cache: npm` here: setup-node runs the runner's bundled npm inside
      # the repo to find the cache dir, and the devEngines pin rejects any npm
      # but 11.19.1 (the runner moved to 11.20.0), failing before any test ran.
      # Install the pinned npm from outside the repo, then cache ~/.npm.
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      # package.json pins npm via devEngines; match it exactly.
      - run: npm install -g npm@11.19.1
        working-directory: ${{ runner.temp }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci

      - name: Prepare and validate local environment template
        run: |
          node scripts/setup-local.mjs --prepare
          node scripts/setup-local.mjs --check

      - name: Generate Prisma client
        run: npm run generate --workspace=@repo/db

      # Migrations are hand-written in this repo (prisma migrate dev can't
      # run non-interactively), so verify they apply cleanly to an empty
      # database and produce exactly what schema.prisma describes.
      - name: Check migrations match schema
        working-directory: packages/db
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      # `expo start` normally generates this (gitignored) file; it's what
      # declares types for side-effect imports like `@/global.css`, so a
      # fresh checkout can't type-check mobile without it.
      - name: Generate Expo type declarations
        run: echo '/// <reference types="expo/types" />' > apps/mobile/expo-env.d.ts

      - name: Type-check
        run: npx turbo run check-types

      # mobile is excluded: `expo lint` currently crashes inside
      # eslint-config-expo and, when its config is missing, installs
      # packages and rewrites package-lock.json instead of linting.
      - name: Lint
        run: npx turbo run lint --filter=!mobile

      - name: Test
        run: npx turbo run test

      # End-to-end API tests: real Nest app, real Postgres, and SeaweedFS
      # standing in for R2 (S3 API). MinIO's public images and binaries were
      # withdrawn, so it can no longer be pulled in CI. The tests create the
      # bucket themselves. The config travels in an env var because a file
      # bind-mount is one more thing to go wrong.
      - name: Start S3-compatible storage
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -e 'S3CFG={"identities":[{"name":"admin","credentials":[{"accessKey":"studio_os","secretKey":"studio_os_minio"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:studio-os-media"]}]}' \
            --entrypoint sh chrislusf/seaweedfs:latest \
            -c 'echo "$S3CFG" > /tmp/s3.json && exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data'
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/)" != 000 ] && exit 0; sleep 1; done
          docker logs s3 | tail -20; exit 1

      - name: API e2e
        run: npm run test:e2e --workspace=api
        env:
          E2E_DATABASE_URL: postgresql://studio_os:studio_os@localhost:5432/studio_os_ci

      - name: Build
        run: npx turbo run build --filter=api --filter=web
